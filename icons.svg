<?xml version="1.0" encoding="UTF-8"?>
<!--
  QubitSemi Solutions · Schematic Icon System
  ─────────────────────────────────────────────
  Canvas        24 × 24   (viewBox="0 0 24 24")
  Safe area     20 × 20   (2 px padding on all sides)
  Stroke        1.4       (currentColor)
  Stroke linecap/linejoin: round
  Corner radius 0.5       (rect rx="0.5")
  Grid          2 px sub‑grid for crisp pixels at 24 / 32 / 56 px sizes
  Accent        1 small filled shape per icon (currentColor, ~0.45–0.7 opacity)
  Reference     <svg class="icon icon-v"><use href="icons.svg#i-vlsi"/></svg>
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <!-- 1 · VLSI · silicon die with bond-wire pins -->
    <symbol id="i-vlsi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4"  y1="2"  x2="4"  y2="4"/>
      <line x1="8"  y1="2"  x2="8"  y2="4"/>
      <line x1="12" y1="2"  x2="12" y2="4"/>
      <line x1="16" y1="2"  x2="16" y2="4"/>
      <line x1="20" y1="2"  x2="20" y2="4"/>
      <line x1="4"  y1="20" x2="4"  y2="22"/>
      <line x1="8"  y1="20" x2="8"  y2="22"/>
      <line x1="12" y1="20" x2="12" y2="22"/>
      <line x1="16" y1="20" x2="16" y2="22"/>
      <line x1="20" y1="20" x2="20" y2="22"/>
      <line x1="2"  y1="8"  x2="4"  y2="8"/>
      <line x1="2"  y1="12" x2="4"  y2="12"/>
      <line x1="2"  y1="16" x2="4"  y2="16"/>
      <line x1="20" y1="8"  x2="22" y2="8"/>
      <line x1="20" y1="12" x2="22" y2="12"/>
      <line x1="20" y1="16" x2="22" y2="16"/>
      <rect x="4" y="4" width="16" height="16" rx="0.5"/>
      <line x1="4"  y1="10" x2="20" y2="10"/>
      <line x1="4"  y1="14" x2="20" y2="14"/>
      <line x1="10" y1="4"  x2="10" y2="20"/>
      <line x1="14" y1="4"  x2="14" y2="20"/>
      <rect x="10" y="10" width="4" height="4" fill="currentColor" fill-opacity="0.45" stroke="none"/>
    </symbol>

    <!-- 2 · QUANTUM · atom with orbital ellipse -->
    <symbol id="i-quantum" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8"/>
      <ellipse cx="12" cy="12" rx="8" ry="3.5"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor" fill-opacity="0.7" stroke="none"/>
    </symbol>

    <!-- 3 · NEXT-GEN · hex lattice node -->
    <symbol id="i-nextgen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12,3 21,8 21,16 12,21 3,16 3,8"/>
      <line x1="12" y1="3"  x2="12" y2="21"/>
      <line x1="3"  y1="8"  x2="21" y2="16"/>
      <line x1="21" y1="8"  x2="3"  y2="16"/>
      <circle cx="12" cy="12" r="1.4" fill="currentColor" fill-opacity="0.5" stroke="none"/>
    </symbol>

    <!-- 4 · VERIFICATION · oscilloscope with constrained-random trace -->
    <symbol id="i-verification" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="0.5"/>
      <line x1="3"  y1="9"  x2="5"  y2="9"/>
      <line x1="3"  y1="15" x2="5"  y2="15"/>
      <line x1="19" y1="9"  x2="21" y2="9"/>
      <line x1="19" y1="15" x2="21" y2="15"/>
      <path d="M5 12 L7 12 L8.5 7 L10 17 L11.5 9 L13 14 L15 12 L19 12"/>
      <circle cx="10" cy="17" r="0.9" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- 5 · FPGA · chip with bond pads and routing traces -->
    <symbol id="i-fpga" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="7"  y1="3" x2="7"  y2="6"/>
      <line x1="10" y1="3" x2="10" y2="6"/>
      <line x1="14" y1="3" x2="14" y2="6"/>
      <line x1="17" y1="3" x2="17" y2="6"/>
      <line x1="7"  y1="18" x2="7"  y2="21"/>
      <line x1="10" y1="18" x2="10" y2="21"/>
      <line x1="14" y1="18" x2="14" y2="21"/>
      <line x1="17" y1="18" x2="17" y2="21"/>
      <rect x="5" y="6" width="14" height="12" rx="0.5"/>
      <line x1="9"  y1="6"  x2="9"  y2="9"/>
      <line x1="15" y1="6"  x2="15" y2="9"/>
      <line x1="9"  y1="15" x2="9"  y2="18"/>
      <line x1="15" y1="15" x2="15" y2="18"/>
      <circle cx="16.5" cy="8.5" r="0.8" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- 6 · ALGORITHMS · function gate with I/O traces -->
    <symbol id="i-algorithms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="2"  y1="12" x2="6"  y2="12"/>
      <rect x="6" y="9" width="12" height="6" rx="0.5"/>
      <line x1="18" y1="12" x2="22" y2="12"/>
      <line x1="9"  y1="9"  x2="9"  y2="15"/>
      <line x1="13" y1="9"  x2="13" y2="15"/>
      <line x1="9"  y1="12" x2="13" y2="12"/>
      <circle cx="22" cy="12" r="0.9" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- 7 · CRYPTOGRAPHY · quantum key with photon decoherence -->
    <symbol id="i-cryptography" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="14" r="3.5"/>
      <circle cx="7" cy="14" r="1.2"/>
      <line x1="10.5" y1="14" x2="21" y2="14"/>
      <line x1="16" y1="14" x2="16" y2="17"/>
      <line x1="19" y1="14" x2="19" y2="16"/>
      <circle cx="13" cy="6" r="0.6" fill="currentColor" stroke="none"/>
      <circle cx="18" cy="4" r="0.5" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- 8 · SIMULATION · concentric state-vector rings -->
    <symbol id="i-simulation" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="2.5"/>
      <circle cx="12" cy="12" r="5"   stroke-dasharray="1.6 2"/>
      <circle cx="12" cy="12" r="7.5" stroke-dasharray="1 3"/>
      <line x1="12" y1="12" x2="19.5" y2="6.5"/>
      <polygon points="19.5,6.5 17.4,7.5 18.7,9.3" stroke="none" fill="currentColor"/>
    </symbol>

    <!-- 9 · TRAINING · mortarboard cap with tassel -->
    <symbol id="i-training" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12,4 22,9 12,14 2,9"/>
      <path d="M6 10 L6 15 C6 17 9 18 12 18 C15 18 18 17 18 15 L18 10"/>
      <line x1="22" y1="9" x2="22" y2="14"/>
      <circle cx="22" cy="15" r="0.9" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- 10 · CONTACT · envelope with reply pulse -->
    <symbol id="i-contact" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="6" width="18" height="13" rx="0.5"/>
      <polyline points="3,7 12,13 21,7"/>
      <circle cx="18" cy="17" r="0.9" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- 11 · DATA · storage cylinder (used for Data Engineering tab) -->
    <symbol id="i-data" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="6" rx="7" ry="2"/>
      <path d="M5 6 L5 18 C5 19.5 8.2 20.5 12 20.5 C15.8 20.5 19 19.5 19 18 L19 6"/>
      <path d="M5 12 C5 13.5 8.2 14.5 12 14.5 C15.8 14.5 19 13.5 19 12"/>
      <circle cx="9"  cy="12" r="0.6" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="12" r="0.6" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- bonus · TEAM · two figures on a bench -->
    <symbol id="i-team" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9"  cy="9"    r="2.8"/>
      <circle cx="17" cy="10.5" r="2.2"/>
      <path d="M3 20 C3 16.5 6 14.5 9 14.5 C12 14.5 15 16.5 15 20"/>
      <path d="M14 20 C14 17 16 15 18 18 C20 15 22 17 22 20"/>
    </symbol>

  </defs>
</svg>